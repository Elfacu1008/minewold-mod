name: Compilar y publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - run: gradle build --no-daemon
      - run: cp build/libs/minewold-menu-*[0-9].jar minewold-menu.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Minewold Menu build ${{ github.run_number }}
          files: minewold-menu.jar
          make_latest: true
